name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Extrair o código-fonte (se enviado como .zip)
        run: |
          if [ -f cartucho-src.zip ]; then
            unzip -o -q cartucho-src.zip -d .
            rm cartucho-src.zip
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Baixar libretro.h, rcheevos e os emuladores
        run: bash scripts/fetch-deps.sh

      - name: Restaurar a chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.CARTUCHO_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret CARTUCHO_KEYSTORE_B64 não configurado. Veja o README, seção 'Chave de assinatura'."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cartucho.jks"
          echo "CARTUCHO_KEYSTORE_PATH=$RUNNER_TEMP/cartucho.jks" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          CARTUCHO_KEYSTORE_PASSWORD: ${{ secrets.CARTUCHO_KEYSTORE_PASSWORD }}
          CARTUCHO_VERSION_CODE: ${{ github.run_number }}
          CARTUCHO_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Organizar APKs e gerar SHA-256
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk)
            abi=${base#app-}
            abi=${abi%-release}
            cp "$f" "out/Cartucho-1.0.${{ github.run_number }}-${abi}.apk"
          done
          cd out
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cp ../app/src/main/assets/cores.txt cores-incluidos.txt

      - name: Conferir classes exigidas pelo código nativo
        run: |
          apk=$(ls out/*-arm64-v8a.apk | head -1)
          if ! unzip -p "$apk" 'classes*.dex' | grep -a -q "Lorg/jni_zero/JniInit;"; then
            echo "::error::org/jni_zero/JniInit sumiu do APK (o WebRTC fecharia o app)"; exit 1
          fi

      - name: Ativar aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Autoteste da sala online num Android (emulador)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/autoteste.sh

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cartucho 1.0.${{ github.run_number }}
          body: |
            **Qual arquivo baixar?** Quase todo celular atual usa `arm64-v8a`. Se não souber, baixe o `universal` (maior, funciona em qualquer um).

            **Computador (Windows 10/11, 64 bits):** baixe o `windows-instalador.exe` e abra. Se preferir sem instalar, use o `windows-x64.zip` (extraia e abra `Cartucho.exe`).

            Confira a integridade comparando o SHA-256 do arquivo com o `SHA256SUMS.txt`.
          files: out/*

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Extrair o código-fonte (se enviado como .zip)
        run: |
          if [ -f cartucho-src.zip ]; then
            unzip -o -q cartucho-src.zip -d .
            rm cartucho-src.zip
          fi

      - name: Baixar SDL2, Dear ImGui, miniz e libretro.h
        run: |
          cd desktop/third_party
          curl -fsSL -o sdl.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-VC.zip
          unzip -q sdl.zip && mv SDL2-2.30.9 sdl2
          git clone --depth 1 -b v1.91.9b https://github.com/ocornut/imgui.git
          mkdir -p miniz && curl -fsSL -o miniz.zip https://github.com/richgel999/miniz/releases/download/3.0.2/miniz-3.0.2.zip
          unzip -q -o miniz.zip -d miniz
          curl -fsSL -o libretro.h https://raw.githubusercontent.com/libretro/RetroArch/master/libretro-common/include/libretro.h

      - name: Compilar Cartucho.exe
        run: |
          cmake -S desktop -B build -A x64 -DSDL2_DIR="$PWD/desktop/third_party/sdl2/cmake" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release

      - name: Baixar os emuladores (cores libretro para Windows)
        run: |
          mkdir -p dist/cores dist/assets
          for core in stella prosystem handy fceumm snes9x gambatte mgba genesis_plus_gx picodrive mednafen_pce_fast mednafen_ngp mednafen_wswan fbneo mupen64plus_next melonds citra pcsx_rearmed ppsspp flycast yabause play dolphin opera virtualjaguar atari800 vecx mednafen_vb neocd mednafen_pcfx gearcoleco freeintv o2em freechaf bluemsx fuse cap32 vice_x64sc puae dosbox_pure pokemini potator arduous gw; do
            if curl -fsSL -o "core.zip" "https://buildbot.libretro.com/nightly/windows/x86_64/latest/${core}_libretro.dll.zip"; then
              unzip -o -q core.zip -d dist/cores && echo "$core" >> dist/cores-incluidos.txt
            else
              echo "::warning::Não foi possível baixar $core"
            fi
            rm -f core.zip
          done
          # Arquivos de sistema que os motores precisam (Dolphin Sys, blueMSX, PPSSPP).
          mkdir -p dist/system
          for pack in Dolphin BlueMSX PPSSPP; do
            if curl -fsSL -o pack.zip "https://buildbot.libretro.com/assets/system/$pack.zip"; then
              unzip -o -q pack.zip -d dist/system && echo "sistema: $pack" >> dist/cores-incluidos.txt
            else
              echo "::warning::Não foi possível baixar os arquivos de sistema $pack"
            fi
            rm -f pack.zip
          done
          if [ ! -d dist/system/Machines ]; then
            if curl -fsSL -o bluemsx-src.zip "https://codeload.github.com/libretro/blueMSX-libretro/zip/refs/heads/master"; then
              unzip -q bluemsx-src.zip -d bluemsx-src
              src=$(find bluemsx-src -type d -path "*system/bluemsx" | head -1)
              if [ -n "$src" ]; then cp -r "$src/Databases" "$src/Machines" dist/system/ && echo "sistema: blueMSX (GitHub)" >> dist/cores-incluidos.txt; fi
              rm -rf bluemsx-src bluemsx-src.zip
            fi
          fi

      - name: Montar a pasta do programa
        run: |
          cp build/Release/Cartucho.exe dist/
          cp desktop/third_party/sdl2/lib/x64/SDL2.dll dist/
          cp desktop/assets/Geist-Regular.ttf desktop/assets/Geist-SemiBold.ttf dist/assets/
          cp LICENSES.md dist/ 2>/dev/null || true
          ls -la dist dist/cores

      - name: Gerar instalador e .zip
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path dist\* -DestinationPath "out\Cartucho-$v-windows-x64.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$v" "/DSrcDir=$PWD\dist" "/O$PWD\out" desktop\installer.iss
          Get-ChildItem out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out\SHA256SUMS-windows.txt
          Get-Content out\SHA256SUMS-windows.txt

      - name: Publicar na mesma versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: out/*
