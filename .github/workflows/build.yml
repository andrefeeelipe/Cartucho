name: Compilar APK

on:
  push:
    branches: [ main ]
    # Mudanças só no site de download não recompilam o app.
    paths-ignore:
      - 'site/**'
      - 'netlify.toml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Extrair o código-fonte (se enviado como .zip)
        run: |
          if [ -f cartucho-src.zip ]; then
            unzip -o -q cartucho-src.zip -d .
            rm cartucho-src.zip
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Banco de dados do ZX Spectrum (ZXDB) para a Loja
        run: |
          sudo systemctl start mysql
          if curl -fsSL --retry 3 -o zxdb.zip https://github.com/zxdb/ZXDB/raw/master/ZXDB_mysql.sql.zip && unzip -o -q zxdb.zip; then
            mysql -uroot -proot -e "create database zxdb character set utf8mb4" 2>/dev/null
            mysql -uroot -proot zxdb < ZXDB_mysql.sql 2>/dev/null || echo "::warning::ZXDB não carregou"
            rm -f zxdb.zip ZXDB_mysql.sql
          else
            echo "::warning::ZXDB indisponível; a Loja sai sem ZX Spectrum"
          fi

      - name: Baixar libretro.h, rcheevos e os emuladores
        env:
          LOJA_TSV: ${{ github.workspace }}/loja.tsv
          RELAY_URL: ${{ secrets.CARTUCHO_RELAY }}
        run: bash scripts/fetch-deps.sh

      - name: Guardar o catálogo da Loja para o Windows
        uses: actions/upload-artifact@v4
        with:
          name: loja
          path: |
            app/src/main/assets/loja.json
            loja.tsv
          if-no-files-found: warn

      - name: Restaurar a chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.CARTUCHO_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret CARTUCHO_KEYSTORE_B64 não configurado. Veja o README, seção 'Chave de assinatura'."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cartucho.jks"
          echo "CARTUCHO_KEYSTORE_PATH=$RUNNER_TEMP/cartucho.jks" >> "$GITHUB_ENV"

      - name: NDK (com novas tentativas e plano B)
        run: |
          # O NDK usado pelo Android Gradle Plugin às vezes vem corrompido do servidor do Google ou some da
          # imagem do GitHub. Tenta instalar 3 vezes; se não der, usa o NDK mais novo que já está na máquina.
          WANT=27.0.12077973
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          MGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ ! -f "$SDK/ndk/$WANT/source.properties" ] && [ -n "$MGR" ]; then
            for i in 1 2 3; do
              rm -rf "$SDK/ndk/$WANT"
              yes | "$MGR" --install "ndk;$WANT" > /tmp/ndk.log 2>&1 && [ -f "$SDK/ndk/$WANT/source.properties" ] && break
              tail -3 /tmp/ndk.log; sleep 20
            done
          fi
          if [ -f "$SDK/ndk/$WANT/source.properties" ]; then
            echo "CARTUCHO_NDK=$WANT" >> "$GITHUB_ENV"
          else
            ALT=$(ls "$SDK/ndk" 2>/dev/null | sort -V | tail -1)
            echo "::warning::NDK $WANT indisponível; usando $ALT"
            echo "CARTUCHO_NDK=$ALT" >> "$GITHUB_ENV"
          fi
          ls "$SDK/ndk" || true

      - name: Compilar
        env:
          CARTUCHO_KEYSTORE_PASSWORD: ${{ secrets.CARTUCHO_KEYSTORE_PASSWORD }}
          CARTUCHO_VERSION_CODE: ${{ github.run_number }}
          CARTUCHO_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Organizar APKs e gerar SHA-256
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk)
            abi=${base#app-}
            abi=${abi%-release}
            cp "$f" "out/Cartucho-1.0.${{ github.run_number }}-${abi}.apk"
          done
          cd out
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cp ../app/src/main/assets/cores.txt cores-incluidos.txt
          # Catálogo da Loja: o app busca a versão mais nova em releases/latest/download/loja.json.
          if [ -f ../app/src/main/assets/loja.json ]; then cp ../app/src/main/assets/loja.json loja.json; fi
          if [ -f ../loja.tsv ]; then cp ../loja.tsv loja.tsv; fi

      - name: Conferir classes exigidas pelo código nativo
        run: |
          apk=$(ls out/*-arm64-v8a.apk | head -1)
          if ! unzip -p "$apk" 'classes*.dex' | grep -a -q "Lorg/jni_zero/JniInit;"; then
            echo "::error::org/jni_zero/JniInit sumiu do APK (o WebRTC fecharia o app)"; exit 1
          fi

      - name: Ativar aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Autoteste da sala online num Android (emulador)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/autoteste.sh

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cartucho 1.0.${{ github.run_number }}
          body: |
            **Jeito mais fácil de baixar:** https://cartucho-emulador.netlify.app (o site já sabe se você está no celular ou no computador).

            **Celular:** quase todo celular de hoje usa o `arm64-v8a`. Na dúvida, baixe o `universal` (é maior, mas funciona em qualquer um).

            **Computador (Windows 10 ou 11):** baixe o `windows-instalador.exe` e abra. Para usar sem instalar, baixe o `windows-x64.zip`, abra a pasta e clique em `Cartucho.exe`.

            O `SHA256SUMS.txt` é a "impressão digital" de cada arquivo, para conferir que ninguém mexeu nele.
          files: out/*

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Extrair o código-fonte (se enviado como .zip)
        run: |
          if [ -f cartucho-src.zip ]; then
            unzip -o -q cartucho-src.zip -d .
            rm cartucho-src.zip
          fi

      - name: Baixar SDL2, Dear ImGui, miniz e libretro.h
        run: |
          cd desktop/third_party
          curl -fsSL -o sdl.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-VC.zip
          unzip -q sdl.zip && mv SDL2-2.30.9 sdl2
          git clone --depth 1 -b v1.91.9b https://github.com/ocornut/imgui.git
          mkdir -p miniz && curl -fsSL -o miniz.zip https://github.com/richgel999/miniz/releases/download/3.0.2/miniz-3.0.2.zip
          unzip -q -o miniz.zip -d miniz
          curl -fsSL -o libretro.h https://raw.githubusercontent.com/libretro/RetroArch/master/libretro-common/include/libretro.h
          curl -fsSL -o libretro_vulkan.h https://raw.githubusercontent.com/libretro/libretro-common/master/include/libretro_vulkan.h
          git clone --depth 1 --branch v1.3.296 https://github.com/KhronosGroup/Vulkan-Headers.git vulkan-headers

      - name: Compilar Cartucho.exe
        env:
          CARTUCHO_GOOGLE_DESKTOP_ID: ${{ secrets.CARTUCHO_GOOGLE_DESKTOP_ID }}
          CARTUCHO_GOOGLE_DESKTOP_SECRET: ${{ secrets.CARTUCHO_GOOGLE_DESKTOP_SECRET }}
        run: |
          cmake -S desktop -B build -A x64 -DSDL2_DIR="$PWD/desktop/third_party/sdl2/cmake" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release

      - name: Baixar os emuladores (cores libretro para Windows)
        run: |
          mkdir -p dist/cores dist/assets
          for core in stella prosystem handy fceumm snes9x gambatte mgba genesis_plus_gx picodrive mednafen_pce_fast mednafen_ngp mednafen_wswan fbneo mupen64plus_next melonds citra pcsx_rearmed ppsspp flycast yabause play dolphin opera virtualjaguar atari800 vecx mednafen_vb neocd mednafen_pcfx gearcoleco freeintv o2em freechaf bluemsx fuse cap32 vice_x64sc puae dosbox_pure pokemini potator arduous gw cemu xenia_edge tic80 same_cdi geolith sameduck amiarcadia emuscv hyperscanemu uzem gametank vemulator squirreljme mu numero applewin minivmac hatari 81 b2 vice_xvic vice_xplus4 vice_xpet vice_x128 quasi88 np2kai px68k x1 geartowns ep128emu_core theodore m2000 bk galaksija retro8 wasm4 lowresnx easyrpg scummvm prboom tyrquake ecwolf eduke32 nxengine cannonball pcsx2; do
            if curl -fsSL -o "core.zip" "https://buildbot.libretro.com/nightly/windows/x86_64/latest/${core}_libretro.dll.zip"; then
              unzip -o -q core.zip -d dist/cores && echo "$core" >> dist/cores-incluidos.txt
            else
              echo "::warning::Não foi possível baixar $core"
            fi
            rm -f core.zip
          done
          # Arquivos de sistema que os motores precisam (Dolphin Sys, blueMSX, PPSSPP).
          mkdir -p dist/system
          for pack in Dolphin BlueMSX PPSSPP ScummVM PrBoom ECWolf "NXEngine%20%28Cave%20Story%29" LRPS2; do
            if curl -fsSL -o pack.zip "https://buildbot.libretro.com/assets/system/$pack.zip"; then
              unzip -o -q pack.zip -d dist/system && echo "sistema: $pack" >> dist/cores-incluidos.txt
            else
              echo "::warning::Não foi possível baixar os arquivos de sistema $pack"
            fi
            rm -f pack.zip
          done
          if [ ! -d dist/system/Machines ]; then
            if curl -fsSL -o bluemsx-src.zip "https://codeload.github.com/libretro/blueMSX-libretro/zip/refs/heads/master"; then
              unzip -q bluemsx-src.zip -d bluemsx-src
              src=$(find bluemsx-src -type d -path "*system/bluemsx" | head -1)
              if [ -n "$src" ]; then cp -r "$src/Databases" "$src/Machines" dist/system/ && echo "sistema: blueMSX (GitHub)" >> dist/cores-incluidos.txt; fi
              rm -rf bluemsx-src bluemsx-src.zip
            fi
          fi

      - name: Pegar o catálogo da Loja
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: loja
          path: loja-art

      - name: Montar a pasta do programa
        run: |
          cp build/Release/Cartucho.exe dist/
          cp desktop/third_party/sdl2/lib/x64/SDL2.dll dist/
          cp desktop/assets/Geist-Regular.ttf desktop/assets/Geist-SemiBold.ttf dist/assets/
          cp LICENSES.md dist/ 2>/dev/null || true
          # Catálogo da Loja: o mesmo gerado na compilação do Android (com o banco do ZX Spectrum).
          if [ -f loja-art/loja.tsv ]; then cp loja-art/loja.tsv dist/loja.tsv
          else python scripts/build-loja.py dist/loja.json dist/loja.tsv || echo "::warning::Catálogo da Loja indisponível"; fi
          ls -la dist dist/cores

      - name: OpenGL por software (plano B para qualquer Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mesa llvmpipe: OpenGL que roda no processador. Vai na pasta "mesa" e só é usado quando o driver
          # de vídeo do computador não serve (sem driver, máquina virtual, placa antiga, área de trabalho remota).
          # As versões mais novas do pacote às vezes não trazem o opengl32.dll; tenta as anteriores até achar.
          $rels = gh api "repos/pal1000/mesa-dist-win/releases?per_page=15" | ConvertFrom-Json
          $gl = $null
          foreach ($rel in $rels) {
            foreach ($asset in ($rel.assets | Where-Object { $_.name -match '\.7z$' -and $_.name -notmatch 'devel|debug|msvc-dev' })) {
              Remove-Item -Recurse -Force mesa, mesa.7z -ErrorAction SilentlyContinue
              try { Invoke-WebRequest $asset.browser_download_url -OutFile mesa.7z } catch { continue }
              7z x mesa.7z -omesa -y | Out-Null
              $gl = Get-ChildItem -Recurse mesa -Filter opengl32.dll | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
              if ($gl) { Write-Host "Mesa $($rel.tag_name) ($($asset.name))"; break }
            }
            if ($gl) { break }
          }
          if (-not $gl) { Write-Host "::warning::opengl32.dll do Mesa não encontrado; o Cartucho vai sem o plano B"; exit 0 }
          New-Item -ItemType Directory -Force -Path dist\mesa | Out-Null
          Get-ChildItem $gl.Directory -Filter *.dll | Where-Object { $_.Name -match '^(opengl32|libgallium_wgl|libglapi|libgallium)\.dll$' } | Copy-Item -Destination dist\mesa
          if (Test-Path (Join-Path $gl.Directory.Parent.FullName "LICENSE*")) { Copy-Item (Join-Path $gl.Directory.Parent.FullName "LICENSE*") dist\mesa }
          Get-ChildItem dist\mesa | ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.Name }

      - name: Autoteste no Windows (abre jogos homebrew de verdade)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A máquina do GitHub não tem placa de vídeo: o Cartucho precisa achar sozinho o plano B (pasta "mesa"),
          # exatamente como num computador sem driver.
          $t = "autoteste"
          Copy-Item -Recurse dist $t
          if (-not (Test-Path "$t\mesa\opengl32.dll")) { Write-Host "::warning::sem OpenGL por software; autoteste do Windows pulado"; exit 0 }
          $env:GALLIUM_DRIVER = "llvmpipe"
          $env:SDL_AUDIODRIVER = "dummy"
          # Um jogo de cada sistema, direto do Homebrew Hub (o mesmo caminho que a Loja usa).
          $games = python -c "rows=[l.rstrip('\n').split('\t') for l in open('dist/loja.tsv',encoding='utf-8')];pick={};[pick.setdefault(r[2],r) for r in rows if len(r)>12 and r[3]=='game' and (r[11] or r[8])];print('\n'.join(r[2]+'|'+(r[11] or 'https://hh3.gbdev.io/static/'+r[8]+'/entries/'+r[0]+'/'+r[6])+'|'+r[6] for r in pick.values()))"
          $prefs = Join-Path $env:APPDATA "Cartucho\Cartucho"
          $failed = $false
          # Tela inicial com uma pasta de jogos "difícil": nomes em japonês, símbolos e um .zip, como numa coleção real.
          $weird = Join-Path $PWD "pasta teste · ROM's ★"
          New-Item -ItemType Directory -Force -Path $weird, (Join-Path $weird "SNES"), (Join-Path $weird "サブ") | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $weird "SNES\ゼルダの伝説 ★ 神々のトライフォース ™ (J).sfc"), [byte[]]::new(131072))
          [IO.File]::WriteAllBytes((Join-Path $weird "サブ\Pokémon Ω Edição Ünïcödé 🎮.gba"), [byte[]]::new(65536))
          [IO.File]::WriteAllBytes((Join-Path $weird "SNES\super_mario_world_usa.sfc"), [byte[]]::new(131072))
          [IO.File]::WriteAllBytes((Join-Path $weird "SNES\Super Mario World (Brasil) [T+Por] www.romsportugues.com.smc"), [byte[]]::new(131072))
          [IO.File]::WriteAllBytes((Join-Path $weird "Jogo.7z.001"), [byte[]]::new(1024))
          [IO.File]::WriteAllBytes((Join-Path $weird "Jogo.7z.002"), [byte[]]::new(1024))
          $inner = Join-Path $PWD "zipdentro"; New-Item -ItemType Directory -Force $inner | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $inner "ドラゴン ★.gba"), [byte[]]::new(4096))
          Compress-Archive -Path "$inner\*" -DestinationPath (Join-Path $weird "pacote ★.zip") -Force
          New-Item -ItemType Directory -Force -Path $prefs | Out-Null
          [IO.File]::WriteAllText((Join-Path $prefs "config.ini"), "folder=$weird`n", [Text.UTF8Encoding]::new($false))
          $p = Start-Process -FilePath "$t\Cartucho.exe" -ArgumentList "--autoteste-inicio" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "::error::a tela inicial travou"; $failed = $true }
          else {
            Write-Host "tela inicial: código de saída $($p.ExitCode)"
            Get-Content (Join-Path $prefs "inicio.log") -ErrorAction SilentlyContinue
            if (Test-Path (Join-Path $prefs "inicio-erro.txt")) { Get-Content (Join-Path $prefs "inicio-erro.txt") }
            if (-not (Select-String -Path (Join-Path $prefs "inicio.log") -Pattern "^capa:" -Quiet)) { Write-Host "::warning::nenhuma capa chegou no autoteste" }
            if ($p.ExitCode -eq 0) { Write-Host "OK: tela inicial abriu, procurou na pasta e passou por Biblioteca, Loja e Ajustes" }
            else { Write-Host "::error::a tela inicial FECHOU POR ERRO (código $($p.ExitCode))"; $failed = $true }
          }
          Remove-Item (Join-Path $prefs "config.ini") -ErrorAction SilentlyContinue
          foreach ($line in $games -split "`n") {
            if (-not $line.Trim()) { continue }
            $sys, $url, $file = $line.Trim().Split('|')
            $rom = Join-Path $PWD ("rom-$sys-" + [IO.Path]::GetFileName($file))
            try { Invoke-WebRequest $url -OutFile $rom } catch { Write-Host "::warning::Não baixou $url"; continue }
            if ($rom.EndsWith(".zip")) {
              $x = "$rom-x"; Expand-Archive $rom -DestinationPath $x -Force
              $inner = Get-ChildItem -Recurse $x -File | Where-Object { $_.Extension -match '^\.(tap|tzx|z80|sna|szx)$' } | Select-Object -First 1
              if (-not $inner) { Write-Host "::warning::zip sem jogo: $url"; continue }
              $rom = $inner.FullName
            }
            Write-Host "==> $sys : $file"
            $p = Start-Process -FilePath "$t\Cartucho.exe" -ArgumentList "--autoteste", "`"$rom`"", $sys -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "::error::$sys travou (não terminou em 2 minutos)"; $failed = $true }
            else {
              $code = $p.ExitCode
              Write-Host "código de saída: $code"
              Get-Content (Join-Path $prefs "ultimo-jogo.log") -ErrorAction SilentlyContinue
              if (Test-Path (Join-Path $prefs "ultimo-erro.txt")) { Get-Content (Join-Path $prefs "ultimo-erro.txt") }
              if ($code -eq 0) { Write-Host "OK: $sys rodou 300 quadros" }
              elseif ($code -eq 1) { Write-Host "::error::${sys}: a janela de vídeo não abriu nem com o OpenGL por software"; $failed = $true }
              elseif ($code -eq 2) { Write-Host "::warning::$sys não abriu no ambiente do GitHub (código $code)" }
              else { Write-Host "::error::$sys FECHOU POR ERRO (código $code)"; $failed = $true }
            }
          }
          if ($failed) { exit 1 }

      - name: Gerar instalador e .zip
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path dist\* -DestinationPath "out\Cartucho-$v-windows-x64.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$v" "/DSrcDir=$PWD\dist" "/O$PWD\out" desktop\installer.iss
          Get-ChildItem out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out\SHA256SUMS-windows.txt
          Get-Content out\SHA256SUMS-windows.txt

      - name: Publicar na mesma versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: out/*

      - name: Avisar o site de download (Netlify)
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          # Opcional: com o secret NETLIFY_BUILD_HOOK, o site é publicado de novo assim que a versão sai.
          # Sem ele, o site continua certo (busca a versão no GitHub ao abrir), só o plano B fica atrasado.
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK" && echo "Netlify avisado"; else echo "NETLIFY_BUILD_HOOK não configurado; pulando"; fi
