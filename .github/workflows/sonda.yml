name: sonda
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          s() { echo; echo "=== $1"; curl -sL -m 30 -A "Cartucho-loja/1.0" "$1" | head -c ${2:-2500}; echo; }
          s "https://api.zxinfo.dk/v3/search?query=&mode=compact&size=2&offset=0&contenttype=SOFTWARE&availability=Available&genretype=GAMES&output=simple"
          s "https://api.zxinfo.dk/v3/search?query=&mode=full&size=1&offset=0&contenttype=SOFTWARE&availability=Available&genretype=GAMES" 6000
          s "https://api.zxinfo.dk/v3/" 1500
          s "https://www.lexaloffle.com/bbs/cpost_lister3.php?max=4&start_index=0&cat=7&sub=2&orderby=featured&version=000204&cfil=0" 3000
          s "https://raw.githubusercontent.com/icaroferre/Pico8-Cartloader/main/cartloader.py" 4000
          s "https://tic80.com/api?fn=dir&path=play/Games" 2000
          s "https://tic80.com/play?cat=0" 1500
          for a in android/latest/arm64-v8a windows/x86_64/latest; do echo "=== buildbot $a"; curl -sL -m 30 "https://buildbot.libretro.com/nightly/$a/" | grep -oE '(fake08|retro8|tic80|vecx|fuse|arduous|scummvm)[a-z_]*\.(so|dll)\.zip' | sort -u; done
