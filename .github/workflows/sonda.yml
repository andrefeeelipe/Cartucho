name: sonda
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          sudo systemctl start mysql
          curl -sL -o z.zip https://github.com/zxdb/ZXDB/raw/master/ZXDB_mysql.sql.zip && unzip -o -q z.zip && ls -la *.sql
          mysql -uroot -proot -e "create database zxdb character set utf8mb4"
          mysql -uroot -proot zxdb < ZXDB_mysql.sql 2>&1 | tail -3
          q() { echo "--- $1"; mysql -uroot -proot zxdb -e "$1" 2>&1 | head -${2:-40}; }
          q "show tables" 120
          q "describe entries"
          q "describe downloads"
          q "select * from availabletypes"
          q "select * from genretypes" 80
          q "select * from filetypes" 60
          q "describe languages" ; q "select * from languages where id in ('pt','es','en')"
          q "select availabletype_id,count(*) from entries group by availabletype_id"
          q "select e.language_id,count(*) from entries e group by e.language_id order by 2 desc" 20
          q "select e.id,e.title,e.availabletype_id,e.genretype_id,e.language_id,d.file_link,d.filetype_id from entries e join downloads d on d.entry_id=e.id where e.id in (2259, 100, 5000) limit 20"
          q "select substring_index(file_link,'/',3) p,count(*) from downloads group by p order by 2 desc" 20
          echo "=== tic80 page"; curl -sL -m 30 "https://tic80.com/play?cart=188" | grep -iE 'by |author|license|og:|class="card' | head -20
          for p in Games Demos Tools Demoscene Music WIP; do echo "$p: $(curl -sL -m 30 "https://tic80.com/api?fn=dir&path=play/$p" | grep -c 'hash =')"; done
