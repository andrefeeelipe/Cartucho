<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cartucho · Jogando</title>
<meta name="theme-color" content="#111114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html, body { margin: 0; height: 100%; background: #111114; color: #fff; font-family: -apple-system, system-ui, "Inter", sans-serif; overflow: hidden; overscroll-behavior: none; }
  #wrap { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #game { width: 100%; height: 100%; }
  #back { position: fixed; z-index: 1000; top: calc(8px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left)); background: rgba(30, 30, 36, 0.7); color: #fff; border: 0; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; text-decoration: none; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; line-height: 1.5; }
  #msg a { color: #C9C6EE; }
</style>
</head>
<body>
<div id="wrap"><div id="game"></div></div>
<a id="back" href="./">‹ Biblioteca</a>
<div id="msg">Abrindo o jogo…</div>
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var C = window.Cartucho;
  var msg = document.getElementById('msg');
  var id = new URLSearchParams(location.search).get('id');

  // Emulador (EmulatorJS, código aberto, GPL-3) pela CDN dele: o site do Cartucho só entrega esta página.
  var EJS_VERSION = '4.2.3';

  function fail(text) {
    msg.innerHTML = '';
    msg.appendChild(document.createTextNode(text + ' '));
    var a = document.createElement('a');
    a.href = './';
    a.textContent = 'Voltar para a biblioteca';
    msg.appendChild(a);
  }

  if (!id) return fail('Jogo não encontrado.');
  C.getGame(id).then(function (g) {
    if (!g || !g.blob) return fail('Esse jogo não está mais guardado neste aparelho.');
    msg.remove();
    C.touchGame(id);
    var file = g.blob instanceof File ? g.blob : new File([g.blob], g.name);
    var sys = C.systemByKey(g.system);
    document.title = C.titleOf(g.name) + ' · Cartucho';

    window.EJS_player = '#game';
    window.EJS_core = sys ? sys.id : g.system;
    window.EJS_gameUrl = file;                 // o arquivo sai direto do aparelho, nada é enviado
    window.EJS_gameName = C.stemOf(g.name);    // nome dos saves e estados
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/' + EJS_VERSION + '/data/';
    window.EJS_language = 'pt-BR';
    window.EJS_color = '#4F43AE';
    window.EJS_backgroundColor = '#111114';
    window.EJS_startButtonName = 'Jogar';
    window.EJS_defaultOptions = { 'save-save-interval': '30' };  // guarda o save do jogo a cada 30 s
    window.EJS_threads = typeof SharedArrayBuffer === 'function';
    window.EJS_onGameStart = function () {
      document.getElementById('back').style.opacity = '0.55';
    };

    var s = document.createElement('script');
    s.src = window.EJS_pathtodata + 'loader.js';
    s.onerror = function () { fail('Não foi possível baixar o emulador. Confira a internet e tente de novo.'); };
    document.body.appendChild(s);
  }).catch(function () {
    fail('Este navegador não deixa abrir os jogos guardados (modo privado?).');
  });

  // Ao sair (voltar, trocar de app), o EmulatorJS grava o save; damos um instante para ele.
  document.getElementById('back').addEventListener('click', function (e) {
    var emu = window.EJS_emulator;
    if (emu && emu.gameManager && emu.started) {
      e.preventDefault();
      try { emu.gameManager.saveSaveFiles(); } catch (err) {}
      setTimeout(function () { location.href = './'; }, 400);
    }
  });
})();
</script>
</body>
</html>
