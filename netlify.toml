# Site de download do Cartucho (pasta site/). Sem dependências: só Node para gerar o release.json.
[build]
  base = "site"
  publish = "."
  command = "node build.mjs"
  # Cada publicação gasta créditos do plano grátis (15 por deploy, limite de 300/mês).
  # Só publica quando algo dentro de site/ muda; versões novas do app NÃO precisam de deploy,
  # porque o site busca os links da versão mais recente no GitHub quando a página abre.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# A versão muda a cada build do app: nunca guardar em cache por muito tempo.
[[headers]]
  for = "/release.json"
  [headers.values]
    Cache-Control = "public, max-age=60"
